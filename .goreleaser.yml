version: 2

before:
  hooks:
  - go mod tidy
builds:
- env:
  - CGO_ENABLED=0
  binary: NAMEinator
  goos:
  - windows
  - darwin
  - linux
  goarch:
  - amd64
  - arm
  - arm64
  goarm:
  - 6
  - 7
  ldflags:
  - -s -w -X main.VERSION={{.Version}}
  ignore:
  - goos: windows
    goarch: arm
archives:
- formats: [tar.gz]
  # Windows users expect a zip that Explorer can open natively
  format_overrides:
  - goos: windows
    formats: [zip]
  files:
  - README.md
  - COPYING
  - AUTHORS
  - datasrc/*
checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
